name: Tracker daily sync

on:
  schedule:
    # 12:00 UTC daily — late enough that Oura has synced last night's sleep.
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days (use 90 for first backfill)"
        default: "7"
        required: false

permissions:
  contents: write

concurrency:
  group: tracker-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tracker/requirements.txt

      - run: pip install -r tracker/requirements.txt

      - name: Fetch Oura + bank data
        env:
          OURA_TOKEN: ${{ secrets.OURA_TOKEN }}
          SIMPLEFIN_ACCESS_URL: ${{ secrets.SIMPLEFIN_ACCESS_URL }}
          PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
          PLAID_SECRET: ${{ secrets.PLAID_SECRET }}
          PLAID_ACCESS_TOKEN: ${{ secrets.PLAID_ACCESS_TOKEN }}
          PLAID_ENV: ${{ vars.PLAID_ENV }}
        run: python tracker/track.py fetch --days "${{ github.event.inputs.days || '7' }}"

      - name: Rebuild report
        run: python tracker/track.py report && python tracker/plot.py

      - name: Commit and push
        run: |
          git config user.name "tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tracker/data tracker/report.md tracker/chart.png
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "tracker: daily sync $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "${GITHUB_REF_NAME}"
          fi

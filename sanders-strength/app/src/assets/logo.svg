<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Sanders Strength mark">
  <defs>
    <linearGradient id="ssRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff2f3e"/>
      <stop offset="100%" stop-color="#7a0f18"/>
    </linearGradient>
  </defs>
  <!-- shield -->
  <path d="M50 4 L90 18 V48 C90 74 72 90 50 98 C28 90 10 74 10 48 V18 Z"
        fill="#151517" stroke="#3d3d42" stroke-width="2"/>
  <path d="M50 10 L84 22 V48 C84 70 68 84 50 91 C32 84 16 70 16 48 V22 Z"
        fill="none" stroke="url(#ssRed)" stroke-width="1.5" opacity="0.6"/>
  <!-- crossed axes -->
  <g stroke="url(#ssRed)" stroke-width="4" stroke-linecap="square">
    <line x1="26" y1="30" x2="74" y2="78"/>
    <line x1="74" y1="30" x2="26" y2="78"/>
  </g>
  <g fill="url(#ssRed)">
    <path d="M20 24 L34 24 L30 36 L22 38 Z"/>
    <path d="M80 24 L66 24 L70 36 L78 38 Z"/>
  </g>
  <!-- rune (Tiwaz) center -->
  <path d="M50 40 L50 66 M50 40 L62 52 M50 52 L62 40" fill="none" stroke="#f2f0ec" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

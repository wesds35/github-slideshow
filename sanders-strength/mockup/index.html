<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanders Strength</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="splash">
    <img class="logo-mark" src="assets/logo.svg" alt="Sanders Strength shield mark">
    <div>
      <div class="wordmark">SANDERS STRENGTH</div>
      <div class="tagline">ᛊ Forge The Work ᛊ</div>
    </div>

    <div class="role-select">
      <div class="role-card" data-role-link="dashboard.html">
        <div class="role-icon">⚒</div>
        <h4>I'm a Coach</h4>
        <p>Build programs, manage your roster, track team volume.</p>
      </div>
      <div class="role-card" data-role-link="athlete.html">
        <div class="role-icon">🛡</div>
        <h4>I'm an Athlete</h4>
        <p>Log your lifts, chase PRs, earn your badges.</p>
      </div>
    </div>

    <p class="footer-note">Your training data stays between you and your coach — nothing here is shared publicly or sold to anyone. v1.0 mockup.</p>
  </div>
  <script src="assets/app.js"></script>
</body>
</html>
